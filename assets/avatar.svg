<svg fill="none" viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="250" fill="url(#avatarBg)" stroke="url(#ringGrad)" stroke-width="4" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Outer Cyber Tech Nodes -->
  <circle cx="256" cy="20" r="4" fill="#38bdf8" />
  <circle cx="256" cy="492" r="4" fill="#c084fc" />
  <circle cx="20" cy="256" r="4" fill="#38bdf8" />
  <circle cx="492" cy="256" r="4" fill="#818cf8" />

  <!-- Glowing Security Shield -->
  <g filter="url(#glow)">
    <path d="M256 100 L380 160 L380 270 C380 345 256 395 256 395 C256 395 132 345 132 270 L132 160 Z"
          fill="#0f172a" fill-opacity="0.85" stroke="url(#shieldGrad)" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Inner Defense Emblem (Circuit Node + Check) -->
  <path d="M256 160 L330 200 L330 270 C330 320 256 355 256 355 C256 355 182 320 182 270 L182 200 Z"
        fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="4 4" />

  <!-- Shield Core Checkmark -->
  <path d="M210 255 L245 290 L315 220" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Core Pulsing Node -->
  <circle cx="256" cy="325" r="5" fill="#818cf8" />
</svg>
