  <g transform="translate(510, 75)">
    <rect width="180" height="460" rx="10" fill="url(#boxGrad1)" stroke="#10b981" stroke-width="1.5" />
    <text x="90" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">金丝雀VM隔离沙箱</text>

