    <rect x="18" y="55" width="144" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="90" y="81" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Claude Desktop</text>

    <rect x="18" y="112" width="144" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="90" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Antigravity Agent</text>

    <rect x="18" y="169" width="144" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="90" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">Cursor / VS Code</text>

    <rect x="18" y="226" width="144" height="42" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="90" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">CLI / Stdio Runner</text>

    <rect x="18" y="283" width="144" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
