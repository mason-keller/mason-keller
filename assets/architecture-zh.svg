    <text x="105" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#f43f5e">🗄️ SQLi &amp; Database</text>
    <text x="105" y="308" text-anchor="middle" font-size="10.5" fill="#94a3b8">String Concat · NoSQL $where</text>

    <rect x="15" y="335" width="180" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="105" y="358" text-anchor="middle" font-size="12" font-weight="600" fill="#fb923c">🔍 GraphQL Depth Limiter</text>
    <text x="105" y="378" text-anchor="middle" font-size="10.5" fill="#94a3b8">Introspection · Cyclic DoS</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 470 305 L 505 305" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 3" />

