    <text x="90" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">Phase 1</text>
    <text x="90" y="113" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f8fafc">Attack Neutralization</text>
    <text x="90" y="133" text-anchor="middle" font-size="10.5" fill="#94a3b8">Payload Blocked</text>

    <rect x="15" y="175" width="150" height="90" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1" />
    <text x="90" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">Phase 2</text>
    <text x="90" y="223" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f8fafc">Benign Regression</text>
    <text x="90" y="243" text-anchor="middle" font-size="10.5" fill="#94a3b8">Normal Flow Intact</text>

    <rect x="15" y="285" width="150" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="90" y="313" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">node:vm Isolation</text>
    <text x="90" y="333" text-anchor="middle" font-size="10.5" fill="#94a3b8">Timeout &amp; Zero Leak</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 690 305 L 725 305" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3" />

  <!-- 4. Deliverables and Mirroring -->
  <g transform="translate(730, 75)">
    <rect width="170" height="460" rx="10" fill="url(#boxGrad1)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="85" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24">自动化防御交付物</text>

    <rect x="15" y="65" width="140" height="65" rx="6" fill="#1e293b" stroke="#b45309" stroke-width="1" />
    <text x="85" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24">AST Unified Diff</text>
    <text x="85" y="110" text-anchor="middle" font-size="10.5" fill="#94a3b8">Parameterized Queries</text>

    <rect x="15" y="145" width="140" height="65" rx="6" fill="#1e293b" stroke="#b45309" stroke-width="1" />
    <text x="85" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24">Security Score</text>
    <text x="85" y="190" text-anchor="middle" font-size="10.5" fill="#94a3b8">0-100 &amp; Findings JSON</text>

    <rect x="15" y="225" width="140" height="65" rx="6" fill="#1e293b" stroke="#b45309" stroke-width="1" />
    <text x="85" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24">age Vault Keys</text>
    <text x="85" y="270" text-anchor="middle" font-size="10.5" fill="#94a3b8">X25519 &amp; Win DPAPI</text>

    <rect x="15" y="305" width="140" height="75" rx="6" fill="#1e293b" stroke="#b45309" stroke-width="1" />
    <text x="85" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#fbbf24">Tri-Platform Sync</text>
    <text x="85" y="350" text-anchor="middle" font-size="10" fill="#94a3b8">GitHub · GitLab · HF</text>
