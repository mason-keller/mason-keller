    <text x="105" y="98" text-anchor="middle" font-size="10.5" fill="#94a3b8">CSP · HSTS · CORS · Cookies</text>

    <rect x="15" y="125" width="180" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="105" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#818cf8">⚡ DOM XSS Sinks</text>
