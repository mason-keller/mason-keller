    <rect x="15" y="195" width="180" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="105" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#a855f7">🔌 API &amp; BOLA/IDOR</text>
    <text x="105" y="238" text-anchor="middle" font-size="10.5" fill="#94a3b8">Auth Bypass · Mass Assignment</text>

