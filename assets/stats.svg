<svg fill="none" viewBox="0 0 900 190" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
    .card-title-p { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 700; fill: #c084fc; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11.5px; fill: #94a3b8; }
    .badge-pill { rx: 6; fill: #1e293b; stroke: #334155; stroke-width: 1; }
    .badge-txt { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #38bdf8; font-weight: 500; }
  </style>

  <!-- Left Column: Core Focus -->
  <g transform="translate(0, 0)">
    <rect width="435" height="190" rx="12" fill="url(#cardBg2)" stroke="#1e293b" stroke-width="1.2" />
    
    <text x="24" y="32" class="card-title">🛡️ Security Invariants &amp; Research Focus</text>
    
    <circle cx="32" cy="62" r="3.5" fill="#38bdf8" />
    <text x="44" y="66" class="item-title">Automated Defensive Patching</text>
    <text x="44" y="82" class="item-desc">AST rewriting, parameterized query generation &amp; unified diffs</text>

    <circle cx="32" cy="110" r="3.5" fill="#818cf8" />
    <text x="44" y="114" class="item-title">Model Context Protocol (MCP)</text>
    <text x="44" y="130" class="item-desc">High-assurance AI tool orchestration over stdio &amp; SSE transports</text>

    <circle cx="32" cy="158" r="3.5" fill="#c084fc" />
    <text x="44" y="162" class="item-title">Dual-Phase Canary Sandboxing</text>
    <text x="44" y="176" class="item-desc">Node.js vm isolation, exploit neutralization &amp; regression prevention</text>
  </g>

  <!-- Right Column: Engineering Highlights -->
  <g transform="translate(465, 0)">
    <rect width="435" height="190" rx="12" fill="url(#cardBg2)" stroke="#1e293b" stroke-width="1.2" />
    
    <text x="24" y="32" class="card-title-p">🛠️ Key Capabilities &amp; Technology Stack</text>

    <!-- Row 1 -->
    <g transform="translate(24, 52)">
      <rect x="0" width="105" height="26" class="badge-pill" />
      <text x="52" y="17" text-anchor="middle" class="badge-txt">TypeScript</text>
      
      <rect x="115" width="80" height="26" class="badge-pill" />
      <text x="155" y="17" text-anchor="middle" class="badge-txt">Node.js</text>

      <rect x="205" width="85" height="26" class="badge-pill" />
      <text x="247" y="17" text-anchor="middle" class="badge-txt">MCP v1.0</text>

      <rect x="300" width="88" height="26" class="badge-pill" />
      <text x="344" y="17" text-anchor="middle" class="badge-txt">AST / Babel</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(24, 92)">
      <rect x="0" width="100" height="26" class="badge-pill" />
      <text x="50" y="17" text-anchor="middle" class="badge-txt">VM Sandbox</text>

      <rect x="110" width="95" height="26" class="badge-pill" />
      <text x="157" y="17" text-anchor="middle" class="badge-txt">OWASP Top 10</text>

      <rect x="215" width="85" height="26" class="badge-pill" />
      <text x="257" y="17" text-anchor="middle" class="badge-txt">GraphQL</text>

      <rect x="310" width="78" height="26" class="badge-pill" />
      <text x="349" y="17" text-anchor="middle" class="badge-txt">SQLi Def</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(24, 132)">
      <rect x="0" width="105" height="26" class="badge-pill" />
      <text x="52" y="17" text-anchor="middle" class="badge-txt">age (X25519)</text>

      <rect x="115" width="115" height="26" class="badge-pill" />
      <text x="172" y="17" text-anchor="middle" class="badge-txt">Win DPAPI</text>

      <rect x="240" width="148" height="26" class="badge-pill" />
      <text x="314" y="17" text-anchor="middle" class="badge-txt">Tri-Platform Mirror</text>
    </g>
  </g>
</svg>